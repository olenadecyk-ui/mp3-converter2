
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YouTube MP3 Converter</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #eae7e0;
    font-family: Arial, sans-serif;
    color: #38372f;
    padding: 20px;
}

.container {
    background: white;
    max-width: 520px;
    width: 100%;
    padding: 40px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

h1 {
    margin-bottom: 10px;
}

.subtitle {
    color: #888;
    margin-bottom: 30px;
    line-height: 1.5;
}

input, select {
    width: 100%;
    padding: 15px;
    margin-bottom: 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: #77715f;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #5e594b;
}

button:disabled {
    background: #bbb;
    cursor: not-allowed;
}

.status {
    margin-top: 20px;
    font-size: 14px;
    color: #777;
}

.download {
    display: none;
    margin-top: 20px;
    padding: 15px;
    background: #667b65;
    color: white;
    text-decoration: none;
    border-radius: 8px;
}

.quality-label {
    display: block;
    text-align: left;
    font-size: 13px;
    color: #777;
    margin-bottom: 8px;
}

</style>
</head>

<body>

<div class="container">

<h1>♫ YouTube MP3 Converter</h1>

<p class="subtitle">
Convert authorized video sources into MP3 audio
</p>

<input
    type="url"
    id="videoURL"
    placeholder="Paste your video URL here"
>

<label class="quality-label" for="quality">
Audio quality
</label>

<select id="quality">
    <option value="128">128 kbps</option>
    <option value="192" selected>192 kbps</option>
    <option value="256">256 kbps</option>
    <option value="320">320 kbps</option>
</select>

<button id="convertButton">
Convert to MP3
</button>

<div class="status" id="status">
Ready to convert
</div>

<a id="downloadButton" class="download">
Download MP3
</a>

</div>

<script>

const convertButton =
document.getElementById("convertButton");

const status =
document.getElementById("status");

const downloadButton =
document.getElementById("downloadButton");

convertButton.addEventListener("click", async () => {

    const url =
    document.getElementById("videoURL").value.trim();

    const quality =
    document.getElementById("quality").value;

    if (!url) {
        status.textContent = "Please enter a video URL.";
        return;
    }

    convertButton.disabled = true;
    downloadButton.style.display = "none";

    status.textContent = "Contacting conversion server...";

    try {

        const response = await fetch(
            "https://YOUR-BACKEND-URL/convert",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    url: url,
                    quality: quality
                })
            }
        );

        if (!response.ok) {
            throw new Error("Conversion failed.");
        }

        const blob = await response.blob();

        const downloadURL =
        URL.createObjectURL(blob);

        downloadButton.href = downloadURL;
        downloadButton.download = "converted-audio.mp3";

        downloadButton.style.display = "block";

        status.textContent = "Your MP3 is ready!";

    } catch (error) {

        status.textContent =
        "Unable to convert. Check the video source and server.";

        console.error(error);

    } finally {

        convertButton.disabled = false;

    }

});

</script>

</body>
</html>
